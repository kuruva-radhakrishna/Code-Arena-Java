spring.application.name=compiler
server.port=${PORT:8000}

# Render (or any host) uses GET /actuator/health for its health check. This
# service has no Spring Security, so the endpoint is public by default.
management.endpoints.web.exposure.include=health

# Wall-clock limit for the run step of any submitted code (the original had no
# timeout at all - an infinite loop would hang the request forever).
app.execution.timeout-ms=${EXECUTION_TIMEOUT_MS:10000}
