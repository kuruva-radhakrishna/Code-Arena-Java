spring.application.name=backend
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/codearena}

# JWT_SECRET must be overridden with a real secret (32+ bytes) in every deployed
# environment; the default below is for local dev/tests only.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-in-production-0123456789ABCDEF}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
