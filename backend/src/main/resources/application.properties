spring.application.name=backend
server.port=${PORT:8080}

# Only "health" is exposed publicly (see SecurityConfig) - Render/any host
# uses GET /actuator/health for its health check.
management.endpoints.web.exposure.include=health

# Spring Boot 4 moved the Mongo connection URI out of "spring.data.mongodb"
# (now Spring-Data-only concerns like GridFS/auto-index) into "spring.mongodb".
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/codearena}

# JWT_SECRET must be overridden with a real secret (32+ bytes) in every deployed
# environment; the default below is for local dev/tests only.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-in-production-0123456789ABCDEF}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.compiler.base-url=${COMPILER_URL:http://localhost:8000}
app.compiler.connect-timeout-ms=${COMPILER_CONNECT_TIMEOUT_MS:5000}
app.compiler.read-timeout-ms=${COMPILER_READ_TIMEOUT_MS:15000}

app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# GEMINI_API_KEY must be set wherever AI features are actually used; left blank
# by default so the app still starts (and everything else still works) without it.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
app.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}
